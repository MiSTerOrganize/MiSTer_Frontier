name: Build Custom Database

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Daily DB rebuild — picks up new per-core binary hashes when their
    # CI rebuilt the ARM binary without changing the URL (filenames are
    # only dated for RBFs; binary names like games/PICO-8/PICO-8 don't
    # have dates). Without this, db.json hashes stay stale after a per-
    # core binary rebuild until something else triggers a push to main.
    - cron: '17 4 * * *'

# Scoped, not write-all. This job fetches and executes a remote script
# (curl … build_db.py | python3 -), so the token it runs with is worth keeping
# to what it actually uses: pushing db.json to the db branch. The per-core repos
# already scope theirs the same way.
permissions:
  contents: write

jobs:
  build_db:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------------------------------------------------
    # Resolve RBF date-rolls BEFORE building.
    #
    # db_operator FETCHES every URL in external_files.csv. When a per-core
    # repo renames its RBF (_Other/PICO-8_20260616.rbf -> _20260801.rbf),
    # this repo's CSV still names the old path, curl 404s, and the build
    # does not degrade -- it ABORTS. db.json then silently stops updating
    # for every update_all user while the per-core CI stays green.
    #
    # That is not hypothetical: it happened on 2026-08-11 and produced four
    # consecutive red DB builds that nobody was watching, with new ARM
    # binaries sitting on main and reaching no one.
    #
    # sync_csv.yml already knows how to fix the CSV, but it runs on a 6h
    # cron, so the outage lasted until it fired. Running the same sync here
    # makes EVERY rebuild self-healing regardless of what triggered it, in
    # ONE place rather than as an ordering rule each per-core repo has to
    # remember.
    # ---------------------------------------------------------------------
    - uses: actions/checkout@v4

    - name: Sync external_files.csv from per-core repos
      id: sync
      # Non-fatal on purpose. A transient GitHub API hiccup here should
      # leave us no worse than before this step existed -- the build below
      # still runs, and fails loudly if the CSV is genuinely stale. Making
      # it fatal would let an API blip block a rebuild that would otherwise
      # have succeeded.
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 .github/scripts/sync_external_csv.py

    - name: Commit + push CSV if it changed
      # The push must land BEFORE the build step, because build_db.py
      # fetches the raw.githubusercontent URLs (i.e. what is on main), not
      # this runner's working copy.
      #
      # No [skip ci] needed and no recursion risk: a push made with
      # GITHUB_TOKEN does not trigger other workflows.
      run: |
        if git diff --quiet external_files.csv; then
          echo "CSV already in sync."
          exit 0
        fi

        git config user.email "ci@misterorganize"
        git config user.name "MiSTer Organize CI"

        # RETRY ON REJECT. A bare `git push` here loses any race with a
        # concurrent dispatch or the daily cron, and because this step runs
        # under `bash -e` that failure SKIPS the build below -- so db.json keeps
        # the previous hashes while raw.githubusercontent already serves the new
        # binary. That mismatch is what makes the downloader reject and DELETE
        # the file, which the user sees as a black screen.
        #
        # Rebase is correct here because external_files.csv is TEXT and the
        # racing writers make the same edit. It is FORBIDDEN in the per-core
        # binary commit-back, where the payload is a binary blob and a rebase is
        # an unresolvable conflict. Same command, opposite verdict.
        pushed=0
        for attempt in 1 2 3 4 5; do
          git add external_files.csv
          git commit -m "CI: sync external_files.csv from per-core repo RBF dates" || true
          if git push; then pushed=1; break; fi

          echo "push rejected (attempt $attempt) -- fetching and rebasing"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::CSV rebase conflicted -- refusing to guess. Fix external_files.csv by hand."
            exit 1
          fi

          # A race whose other side made the SAME edit leaves nothing to commit.
          # main is already correct, so proceed to the build rather than failing.
          if git diff --quiet origin/main -- external_files.csv; then
            echo "another run already pushed an identical CSV -- continuing to the build"
            pushed=1
            break
          fi
        done

        if [ "$pushed" != "1" ]; then
          echo "::error::could not push external_files.csv after 5 attempts. NOT building:"
          echo "::error::build_db.py reads raw.githubusercontent (i.e. main), so it would"
          echo "::error::publish a db.json built from the STALE csv."
          exit 1
        fi

        echo "CSV in sync on main; building from it."
        # Give raw.githubusercontent a moment to serve the new commit.
        sleep 10

    # CDN PROPAGATION GATE (pre-build).
    #
    # build_db.py FETCHES the raw.githubusercontent URLs in external_files.csv.
    # The CDN is edge-cached, so a build started moments after a push can read
    # the PREVIOUS bytes for a file that push just replaced, and db.json then
    # ships a stale hash. update_all rejects the mismatched file and DELETES it
    # -- a broken core on every user's card until the daily cron. Measured
    # 2026-08-24: a commit-back at 23:26:19Z, a rebuild at 23:26:22Z, and a
    # stale bios hash published.
    #
    # The per-core repos gate their DISPATCH on propagation, which stops the
    # pointless rebuild, but that runs on the producer's runner and raw.github
    # is cached per-POP -- it cannot prove what THIS runner will read. This can,
    # because it runs here, moments before the real fetch, against the same
    # edge. "What git has" is the API contents endpoint, never the CDN.
    #
    # Fatal on refusal: skipping a dispatch means someone publishes later, but
    # building anyway means publishing db.json from stale bytes, which is the
    # harm itself. The previous db.json stays in place and the cron retries.
    - name: Gate - the CDN serves what git has, for every manifest URL
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # build_db.py leaves the checkout on the ORPHAN db branch, which holds
        # only db.json.zip -- so stash the CSV the build is about to use, for
        # the post-build check to read.
        cp external_files.csv "$RUNNER_TEMP/external_files.csv"
        python3 .github/scripts/verify_db_currency.py --pre

    - name: Build Custom Database for MiSTer Downloader
      run: set -o pipefail && curl --fail --location https://raw.githubusercontent.com/theypsilon/Downloader_DB-Template_MiSTer/main/.github/build_db.py | python3 -
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        FINDER_IGNORE: source assets MiSTer_Frontier Scripts games docs

    # CDN PROPAGATION GATE (post-build) -- verify the DELIVERABLE.
    #
    # The pre-build check verifies the INPUTS. This verifies the OUTPUT that
    # users actually receive, so it also catches what the pre-build check
    # cannot: a push landing mid-build, or the builder mis-transcribing a hash.
    # It reads the published db.json.zip off the db branch and compares every
    # entry against git, and it fails on an entry with no CSV row (content that
    # would ship unverified) or a CSV row absent from db.json (a file users
    # would silently stop receiving).
    #
    # Fatal: a red build demands attention. The pre-build check passed, so a
    # failure here is not ordinary propagation lag.
    - name: Gate - the published db.json matches git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 .github/scripts/verify_db_currency.py --post --csv "$RUNNER_TEMP/external_files.csv"
